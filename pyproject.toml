[project]
name = "office"
version = "0.1.0"
description = "Office.AI hub"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "mcp>=2.2.0",
    "markdown>=3.7",
    # Windows ships no IANA tz database, so zoneinfo cannot resolve the zone
    # names claude prints in `/usage` ("Sep 12, 5:40am (Europe/Istanbul)").
    # Pure data, no build step. Without it every claude reset time is None.
    "tzdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["office"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
]
