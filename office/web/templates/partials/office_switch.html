{% set sw = office_switch(request) %}
<div id="office-switch" data-running="{{ '1' if sw.running else '0' }}" hx-get="/fragments/office-switch"
     hx-trigger="office:switch[officeConcerns(this, event)] from:body, office:settings[officeConcerns(this, event)] from:body, office:agents[officeConcerns(this, event)] from:body" hx-swap="outerHTML">
  <span data-office-running><span class="badge {{ 'ok' if sw.running else 'warn' }}">{{ 'Running' if sw.running else 'Paused' }}</span></span>
  <div class="switch-status">
    {% if sw.finishing %}<span>{{ sw.finishing }} turn{{ '' if sw.finishing == 1 else 's' }} still finishing</span>{% endif %}
  </div>
  <form method="post" action="/office/switch" hx-post="/office/switch" hx-target="#office-switch" hx-swap="outerHTML">
    <input type="hidden" name="to" value="{{ 'pause' if sw.running else 'run' }}"><button type="submit">{{ 'Pause' if sw.running else 'Run' }}</button>
  </form>
  <div id="office-timer-pending">
    {% if sw.timer %}<span>{{ sw.timer.to }} at {{ sw.timer.at }}</span>
    <form method="post" action="/office/timer/cancel" hx-post="/office/timer/cancel" hx-target="#office-switch" hx-swap="outerHTML"><button type="submit" class="small">Cancel</button></form>{% endif %}
  </div>
</div>
