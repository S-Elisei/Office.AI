{# Paging controls for a thread panel. #}
{% if has_older or before_id %}
<div class="thread-nav">
  {% if has_older %}
  <button type="button" hx-get="{{ page_url }}?before_id={{ oldest_id }}"
          hx-target="#{{ region_id }}" hx-swap="outerHTML">Show older</button>
  {% endif %}
  {% if before_id %}
  <button type="button" hx-get="{{ page_url }}"
          hx-target="#{{ region_id }}" hx-swap="outerHTML">Back to latest</button>
  {% endif %}
</div>
{% endif %}
