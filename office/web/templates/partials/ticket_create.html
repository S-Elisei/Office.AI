<details class="panel collapse-panel" data-office-details="tickets-new">
  <summary>New ticket</summary>
  <div class="body">
    {# data-office-required: the button is dead and grey until there is a title
       and somebody to address it to (office/web/static/app.js). #}
    <form data-office-create method="post" action="/tickets" hx-post="/tickets" hx-target="#tickets-list" hx-swap="innerHTML"
          data-office-required="title addressee">
      <div class="form-row">
        <label for="nt-title">Title</label>
        <input id="nt-title" name="title" type="text" required>
      </div>
      <div class="form-row">
        <label for="nt-body">Body</label>
        <textarea id="nt-body" name="body" style="min-height: 80px;"></textarea>
      </div>
      <div class="form-row">
        <label for="nt-kind">Kind</label>
        <select id="nt-kind" name="kind">
          <option value="question" selected>question</option>
          <option value="bug">bug</option>
        </select>
      </div>
      <div class="form-row">
        <label for="nt-addressee">Addressed to</label>
        <select id="nt-addressee" name="addressee" required>
          <option value="" disabled selected>choose an agent&hellip;</option>
          {% for name in agent_names %}
          <option value="{{ name }}">{{ name }}</option>
          {% endfor %}
        </select>
        <span class="hint">Who this gates on. It's a decision addressed to them, not just a note.</span>
      </div>
      <div class="form-actions">
        <button type="submit" class="primary" disabled>Create ticket</button>
      </div>
    </form>
  </div>
</details>
