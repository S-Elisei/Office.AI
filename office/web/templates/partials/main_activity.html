<div id="main-activity" hx-get="/fragments/main-activity" hx-trigger="office:activity[officeConcerns(this, event)] from:body" hx-swap="outerHTML">
{# What the director is doing at this moment: the newest line of its own output stream. #}
{% if director_activity %}
<div class="turn-activity tail-row {{ director_activity.kind }}{{ ' started' if director_activity.phase == 'started' }}">
  {% if director_activity.kind != 'text' %}
  <span class="tail-kind">{{ 'running' if director_activity.phase == 'started' else director_activity.kind }}</span>
  {% endif %}
  <span class="tail-text" title="{{ director_activity.text }}">{{ director_activity.text }}</span>
</div>
{% endif %}
</div>
