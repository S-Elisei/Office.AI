{% import "macros.html" as m %}
{% if tickets %}
<section class="panel ticket-alert">
  <header>
    <span>Waiting on you ({{ tickets | length }})</span>
  </header>
  <div class="body ticket-alert-list">
    {% for t in tickets %}
    <a class="ticket-alert-row" href="/tickets/{{ t.id }}" title="{{ t.title }}">
      {{ m.kind_badge(t.kind) }}
      <span class="title">{{ t.title }}</span>
      <span class="from">from {{ t.author }} &middot; {{ t.created_at | fmt_time }}</span>
    </a>
    {% endfor %}
  </div>
</section>
{% else %}
{% endif %}
