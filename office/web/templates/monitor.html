{% extends "base.html" %}
{% block title %}Works — Office.AI{% endblock %}
{% block content %}
  <p class="subtitle">Open works. A work leaves this page when it is closed.</p>

  <div class="grid-2">
    <div>
      <div id="monitor-list"><div class="empty" data-works-empty>Loading works…</div></div>

      <div id="monitor-wakes" hx-get="/fragments/monitor/wakes" hx-trigger="office:messages[officeConcerns(this, event)&&!officeShouldSkip(this)] from:body" hx-swap="innerHTML">
        {% include "partials/monitor_wakes.html" %}
      </div>
    </div>

    <section class="panel monitor-quota-panel">
      <header>Quota left</header>
      <div class="body" id="monitor-quota" hx-get="/fragments/main-quota" hx-trigger="office:quota[officeConcerns(this, event)&&!officeShouldSkip(this)] from:body" hx-swap="innerHTML">
        {% include "partials/quota.html" %}
      </div>
    </section>
  </div>
{% endblock %}
